apiVersion: apps/v1
kind: Deployment
metadata:
  name: url-shortener
  namespace: blink
spec:
  replicas: 2
  selector:
    matchLabels:
      app: url-shortener
  template:
    metadata:
      labels:
        app: url-shortener
    spec:
      terminationGracePeriodSeconds: 15
      containers:
        - name: app
          image: your-registry/blink-url-shortener:1.0.0
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "3000"
            - name: PUBLIC_URL
              value: https://short.example.com
            - name: DB_POOL_MAX
              value: "10"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: blink-secrets
                  key: DATABASE_URL
          ports:
            - name: http
              containerPort: 3000
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: url-shortener
  namespace: blink
spec:
  selector:
    app: url-shortener
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: url-shortener
  namespace: blink
spec:
  ingressClassName: traefik
  rules:
    - host: short.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: url-shortener
                port:
                  name: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: url-shortener
  namespace: blink
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: url-shortener
